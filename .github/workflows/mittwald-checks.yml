name: Mittwald runner checks

# Only explicitly selected, trusted main-branch code runs on the persistent runner.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, notto]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

